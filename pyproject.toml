[project]
name = "refund-agent"
version = "0.1.0"
description = "Agent verifies the eligibility of buyers and then issue a refund ticket to respective teams."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=0.2.0",
    "langchain-tools>=0.1.34",
    "langchain-core>=0.2.0",
    "langgraph>=0.1.0",
    "python-dotenv>=1.2.4",
    "langchain-groq>=1.1.3",
]

[dependency-groups]
dev = [
    "deepeval>=4.3.1",
]
